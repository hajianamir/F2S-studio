version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fireplatform-db
    environment:
      POSTGRES_DB: fireplatform
      POSTGRES_USER: fireuser
      POSTGRES_PASSWORD: firepassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fireuser -d fireplatform"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    container_name: fireplatform-api
    ports:
      - "5000:5000"
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=fireplatform;Username=fireuser;Password=firepassword
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
